<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>งานสมานมิตร 69' M.304 - ความทรงจำ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <!-- Canvas Confetti Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <style>
    @keyframes float {
      0% { transform: translate(0, 0) rotate(0deg); }
      25% { transform: translate(15px, -25px) rotate(3deg); }
      50% { transform: translate(-10px, -45px) rotate(-3deg); }
      75% { transform: translate(-25px, -20px) rotate(2deg); }
      100% { transform: translate(0, 0) rotate(0deg); }
    }
    .floating-card {
      animation: float var(--speed, 12s) ease-in-out infinite alternate;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .floating-card:hover {
      animation-play-state: paused;
      transform: scale(1.15);
      z-index: 50;
    }
  </style>
</head>
<body id="bg-container" class="bg-slate-900 text-white min-h-screen relative overflow-x-hidden bg-cover bg-center transition-all duration-500">

  <!-- Config Supabase -->
  <script>
    const SUPABASE_URL = "https://iadomufmpzsbkghbtpvk.supabase.co/rest/v1/";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlhZG9tdWZtcHpzYmtnaGJ0cHZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1MTUzOTgsImV4cCI6MjEwMjA5MTM5OH0.WY7SdfsThfmX27o2qYCv-LS2UVAgMkbVgMinL6dNQY8";
    const SECRET_ADMIN_KEY = "m304admin"; // รหัสผ่านสำหรับ URL ลับ เช่น ?admin=m304admin

    let supabaseClient = null;
  </script>

  <!-- Navbar / Header -->
  <header class="fixed top-0 left-0 right-0 z-40 bg-black/40 backdrop-blur-md border-b border-white/10 px-6 py-4 flex justify-between items-center">
    <h1 class="text-xl font-bold bg-gradient-to-r from-pink-400 to-sky-300 bg-clip-text text-transparent">
      งานสมานมิตร 69' M.304
    </h1>
    <div class="flex gap-2 items-center">
      <a href="#upload" id="nav-upload" class="px-4 py-2 text-sm rounded-lg bg-pink-600 hover:bg-pink-500 font-semibold shadow-lg shadow-pink-500/30 transition">
        ➕ กรอกข้อมูล
      </a>
      <a href="#wall" id="nav-wall" class="px-4 py-2 text-sm rounded-lg bg-white/10 hover:bg-white/20 border border-white/10 transition">
        🖼️ Floating Wall
      </a>
      <a href="#admin" id="nav-admin" class="hidden px-4 py-2 text-sm rounded-lg bg-red-600/80 hover:bg-red-500 font-semibold border border-red-400 transition">
        ⚙️ Admin Dashboard
      </a>

      <!-- Background Button (Admin Only) -->
      <label id="bg-uploader-btn" class="hidden px-3 py-2 text-sm rounded-lg bg-slate-800 border border-white/20 hover:bg-slate-700 cursor-pointer">
        🎨 ฉากหลัง
        <input type="file" id="bg-uploader" class="hidden" accept="image/*" onchange="changeBackground(event)">
      </label>
    </div>
  </header>

  <div class="pt-24 pb-12 px-4 max-w-7xl mx-auto min-h-screen">

    <!-- Screen 2: Form Upload (Default Visible Entry) -->
    <section id="view-upload" class="max-w-lg mx-auto bg-slate-800/80 backdrop-blur-md p-8 rounded-2xl border border-white/10 shadow-2xl">
      <h2 class="text-2xl font-bold text-pink-400 mb-6 text-center">ฝากความทรงจำถึงห้อง ม.304</h2>
      
      <form id="upload-form" class="space-y-4" onsubmit="handleFormSubmit(event)">
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1">ชื่อ-นามสกุล / ชื่อเล่น</label>
          <input type="text" id="input-name" required placeholder="เช่น พี่เอ็ม / ครูสร้อย" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 focus:border-pink-500 focus:outline-none text-white">
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1">สถานะ</label>
          <select id="input-role" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 focus:border-pink-500 focus:outline-none text-white">
            <option value="นักเรียนปัจจุบัน">นักเรียนปัจจุบัน</option>
            <option value="ครู">ครู</option>
            <option value="บุคลากร">บุคลากร</option>
            <option value="OSK">OSK</option>
            <option value="อื่น ๆ">อื่น ๆ</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1">รูปภาพความทรงจำ (1 ภาพ)</label>
          <input type="file" id="input-image" accept="image/*" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:bg-pink-600 file:text-white hover:file:bg-pink-500">
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1">ความรู้สึกที่มีต่อห้อง ม.304</label>
          <textarea id="input-impression" rows="4" required placeholder="พิมพ์ความประทับใจ หรือข้อความที่อยากบอกพวกเรา..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 focus:border-pink-500 focus:outline-none text-white"></textarea>
        </div>

        <button type="submit" id="submit-btn" class="w-full py-3 bg-gradient-to-r from-pink-500 to-sky-500 font-semibold rounded-lg shadow-lg hover:opacity-90 transition">
          บันทึกความทรงจำ 💖
        </button>
      </form>
    </section>

    <!-- Screen 3: Floating IG Wall -->
    <section id="view-wall" class="hidden relative min-h-[80vh]">
      <div id="wall-container" class="relative w-full h-[78vh] border border-white/10 rounded-2xl bg-black/20 backdrop-blur-sm overflow-hidden p-6">
        <!-- Dynamic Floating Cards -->
      </div>
    </section>

    <!-- Screen 1: Admin Dashboard (Protected) -->
    <section id="view-admin" class="hidden">
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-bold text-sky-400">ระบบจัดการผู้ดูแลระบบ (Admin Dashboard)</h2>
        <div class="flex gap-2 items-center">
          <button onclick="exportToCSV()" class="px-3 py-1.5 text-xs bg-emerald-600 hover:bg-emerald-500 font-semibold rounded-lg shadow transition flex items-center gap-1">
            📊 Export CSV
          </button>
          <span class="text-xs bg-red-500/20 text-red-300 px-3 py-1 rounded-full border border-red-500/30">Admin Mode</span>
        </div>
      </div>

      <div class="bg-slate-800/90 backdrop-blur-md rounded-xl border border-slate-700 overflow-x-auto">
        <table class="w-full text-left text-sm text-slate-300">
          <thead class="bg-slate-900/80 text-slate-400 border-b border-slate-700">
            <tr>
              <th class="p-4">รูปภาพ</th>
              <th class="p-4">ชื่อ</th>
              <th class="p-4">สถานะ</th>
              <th class="p-4">ความรู้สึก</th>
              <th class="p-4">วันที่</th>
              <th class="p-4 text-center">จัดการ</th>
            </tr>
          </thead>
          <tbody id="admin-table-body" class="divide-y divide-slate-700">
            <!-- Dynamic Rows -->
          </tbody>
        </table>
      </div>
    </section>

  </div>

  <!-- Detail Modal -->
  <div id="card-modal" class="fixed inset-0 bg-black/70 backdrop-blur-md hidden z-50 flex items-center justify-center p-4" onclick="closeModal()">
    <div class="bg-slate-800 border border-slate-700 max-w-md w-full rounded-2xl overflow-hidden shadow-2xl relative" onclick="event.stopPropagation()">
      <button onclick="closeModal()" class="absolute top-3 right-3 text-white bg-black/50 hover:bg-black/80 rounded-full w-8 h-8 flex items-center justify-center">✕</button>
      <img id="modal-img" src="" class="w-full h-64 object-cover">
      <div class="p-6">
        <div class="flex items-center gap-2 mb-2">
          <span id="modal-role" class="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-pink-500/20 text-pink-300 border border-pink-500/30"></span>
          <h3 id="modal-name" class="text-lg font-bold text-white"></h3>
        </div>
        <p id="modal-impression" class="text-slate-300 text-sm whitespace-pre-line leading-relaxed"></p>
      </div>
    </div>
  </div>

  <!-- Edit Modal (Admin) -->
  <div id="edit-modal" class="fixed inset-0 bg-black/70 backdrop-blur-md hidden z-50 flex items-center justify-center p-4">
    <div class="bg-slate-800 border border-slate-700 max-w-md w-full p-6 rounded-2xl shadow-2xl">
      <h3 class="text-lg font-bold text-white mb-4">แก้ไขข้อมูล</h3>
      <input type="hidden" id="edit-id">
      <div class="space-y-3">
        <div>
          <label class="text-xs text-slate-400">ชื่อ</label>
          <input type="text" id="edit-name" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm">
        </div>
        <div>
          <label class="text-xs text-slate-400">สถานะ</label>
          <select id="edit-role" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm text-white">
            <option value="นักเรียนปัจจุบัน">นักเรียนปัจจุบัน</option>
            <option value="ครู">ครู</option>
            <option value="บุคลากร">บุคลากร</option>
            <option value="OSK">OSK</option>
            <option value="อื่น ๆ">อื่น ๆ</option>
          </select>
        </div>
        <div>
          <label class="text-xs text-slate-400">ความรู้สึก</label>
          <textarea id="edit-impression" rows="3" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm"></textarea>
        </div>
        <div class="flex justify-end gap-2 pt-2">
          <button onclick="closeEditModal()" class="px-4 py-2 bg-slate-700 text-sm rounded-lg">ยกเลิก</button>
          <button onclick="saveEdit()" class="px-4 py-2 bg-pink-600 text-sm font-semibold rounded-lg">บันทึก</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let allMemories = [];
    let isAdmin = false;

    // --- Safe Init Supabase ---
    function initSupabase() {
      try {
        if (window.supabase && SUPABASE_URL && !SUPABASE_URL.includes("วาง_PROJECT_URL")) {
          supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        } else {
          console.warn("Supabase URL หรือ Key ยังไม่ได้ถูกตั้งค่าให้ถูกต้อง");
        }
      } catch (err) {
        console.error("Supabase Initialization Failed:", err);
      }
    }

    // --- Check Admin & URL Router ---
    function checkAdminStatus() {
      const urlParams = new URLSearchParams(window.location.search);
      isAdmin = (urlParams.get('admin') === SECRET_ADMIN_KEY);

      const bgBtn = document.getElementById('bg-uploader-btn');
      const adminNav = document.getElementById('nav-admin');

      if (isAdmin) {
        bgBtn.classList.remove('hidden');
        adminNav.classList.remove('hidden');
      } else {
        bgBtn.classList.add('hidden');
        adminNav.classList.add('hidden');
      }
    }

    function handleRoute() {
      checkAdminStatus();
      let hash = window.location.hash.replace('#', '');

      if (!hash) {
        switchTab('upload');
        return;
      }

      if (hash === 'admin' && !isAdmin) {
        alert('สำหรับผู้ดูแลระบบเท่านั้น');
        window.location.hash = 'upload';
        return;
      }

      switchTab(hash);
    }

    function switchTab(tab) {
      document.getElementById('view-upload').classList.add('hidden');
      document.getElementById('view-wall').classList.add('hidden');
      document.getElementById('view-admin').classList.add('hidden');

      if (tab === 'wall') {
        document.getElementById('view-wall').classList.remove('hidden');
        renderFloatingWall();
      } else if (tab === 'admin' && isAdmin) {
        document.getElementById('view-admin').classList.remove('hidden');
        renderAdminTable();
      } else {
        document.getElementById('view-upload').classList.remove('hidden');
      }
    }

    window.addEventListener('hashchange', handleRoute);

    window.addEventListener('DOMContentLoaded', () => {
      initSupabase();

      const savedBg = localStorage.getItem('m304_custom_bg');
      if (savedBg) {
        document.getElementById('bg-container').style.backgroundImage = `url('${savedBg}')`;
      }

      if (supabaseClient) {
        fetchMemories();
      }
      handleRoute();
    });

    async function fetchMemories() {
      if (!supabaseClient) return;

      const { data, error } = await supabaseClient
        .from('memories')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        console.error('Error fetching:', error);
        return;
      }
      allMemories = data || [];
      if (window.location.hash === '#wall') renderFloatingWall();
      if (window.location.hash === '#admin' && isAdmin) renderAdminTable();
    }

    function renderFloatingWall() {
      const container = document.getElementById('wall-container');
      container.innerHTML = '';

      if (allMemories.length === 0) {
        container.innerHTML = `<div class="h-full flex items-center justify-center text-slate-400">ยังไม่มีความทรงจำอัปโหลด กดปุ่ม "กรอกข้อมูล" เพื่อเริ่มแชร์ได้เลย!</div>`;
        return;
      }

      allMemories.forEach((item) => {
        const card = document.createElement('div');
        card.className = 'floating-card absolute cursor-pointer bg-slate-800/90 p-2.5 rounded-xl border border-white/20 shadow-xl transition-all w-36 sm:w-44';
        
        const left = Math.floor(Math.random() * 75) + 5;
        const top = Math.floor(Math.random() * 65) + 5;
        const speed = (Math.random() * 8 + 8).toFixed(1);

        card.style.left = `${left}%`;
        card.style.top = `${top}%`;
        card.style.setProperty('--speed', `${speed}s`);

        card.innerHTML = `
          <div class="relative overflow-hidden rounded-lg aspect-square mb-2">
            <img src="${item.image_url}" class="w-full h-full object-cover">
          </div>
          <p class="text-xs font-bold truncate text-white">${item.name}</p>
          <span class="text-[10px] text-pink-300 bg-pink-500/20 px-1.5 py-0.5 rounded border border-pink-500/30">${item.role}</span>
        `;

        card.onclick = () => openModal(item);
        container.appendChild(card);
      });
    }

    async function handleFormSubmit(e) {
      e.preventDefault();
      if (!supabaseClient) {
        alert('กรุณาใส่ค่า SUPABASE_URL และ SUPABASE_KEY ในไฟล์ index.html ก่อนใช้งาน');
        return;
      }

      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.innerText = 'กำลังอัปโหลด...';

      const name = document.getElementById('input-name').value;
      const role = document.getElementById('input-role').value;
      const impression = document.getElementById('input-impression').value;
      const fileInput = document.getElementById('input-image');
      const file = fileInput.files[0];

      try {
        const fileName = `${Date.now()}_${file.name}`;
        const { error: uploadErr } = await supabaseClient
          .storage
          .from('samanmitr-photos')
          .upload(fileName, file);

        if (uploadErr) throw uploadErr;

        const { data: urlData } = supabaseClient
          .storage
          .from('samanmitr-photos')
          .getPublicUrl(fileName);

        const imageUrl = urlData.publicUrl;

        const { error: dbErr } = await supabaseClient
          .from('memories')
          .insert([{ name, role, impression, image_url: imageUrl }]);

        if (dbErr) throw dbErr;

        // Trigger Confetti Effect 🎉
        if (window.confetti) {
          confetti({
            particleCount: 120,
            spread: 80,
            origin: { y: 0.6 }
          });
        }

        alert('บันทึกความทรงจำเรียบร้อยแล้ว! 💖');
        document.getElementById('upload-form').reset();
        await fetchMemories();
        window.location.hash = 'wall';

      } catch (err) {
        alert('เกิดข้อผิดพลาด: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = 'บันทึกความทรงจำ 💖';
      }
    }

    function renderAdminTable() {
      const tbody = document.getElementById('admin-table-body');
      tbody.innerHTML = '';

      allMemories.forEach(item => {
        const tr = document.createElement('tr');
        tr.className = 'hover:bg-slate-700/50 transition';
        tr.innerHTML = `
          <td class="p-4">
            <img src="${item.image_url}" class="w-12 h-12 object-cover rounded-lg border border-slate-600">
          </td>
          <td class="p-4 font-semibold text-white">${item.name}</td>
          <td class="p-4"><span class="text-xs bg-slate-700 px-2 py-1 rounded">${item.role}</span></td>
          <td class="p-4 text-xs max-w-xs truncate">${item.impression}</td>
          <td class="p-4 text-xs text-slate-400">${new Date(item.created_at).toLocaleDateString('th-TH')}</td>
          <td class="p-4 text-center space-x-2">
            <button onclick='openEditModal(${JSON.stringify(item)})' class="px-2.5 py-1 text-xs bg-amber-500/20 text-amber-300 border border-amber-500/30 rounded hover:bg-amber-500/30">แก้ไข</button>
            <button onclick="deleteMemory('${item.id}')" class="px-2.5 py-1 text-xs bg-red-500/20 text-red-300 border border-red-500/30 rounded hover:bg-red-500/30">ลบ</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function deleteMemory(id) {
      if (!confirm('ยืนยันว่าต้องการลบรายการนี้ใช่หรือไม่?')) return;

      const { error } = await supabaseClient.from('memories').delete().eq('id', id);
      if (error) {
        alert('ลบไม่สำเร็จ: ' + error.message);
      } else {
        await fetchMemories();
        renderAdminTable();
      }
    }

    function openEditModal(item) {
      document.getElementById('edit-id').value = item.id;
      document.getElementById('edit-name').value = item.name;
      document.getElementById('edit-role').value = item.role;
      document.getElementById('edit-impression').value = item.impression;
      document.getElementById('edit-modal').classList.remove('hidden');
    }

    function closeEditModal() {
      document.getElementById('edit-modal').classList.add('hidden');
    }

    async function saveEdit() {
      const id = document.getElementById('edit-id').value;
      const name = document.getElementById('edit-name').value;
      const role = document.getElementById('edit-role').value;
      const impression = document.getElementById('edit-impression').value;

      const { error } = await supabaseClient
        .from('memories')
        .update({ name, role, impression })
        .eq('id', id);

      if (error) {
        alert('แก้ไขไม่สำเร็จ: ' + error.message);
      } else {
        closeEditModal();
        await fetchMemories();
        renderAdminTable();
      }
    }

    function exportToCSV() {
      if (!allMemories || allMemories.length === 0) {
        alert('ไม่มีข้อมูลสำหรับส่งออก');
        return;
      }

      const headers = ['ID', 'ชื่อ-นามสกุล', 'สถานะ', 'ความรู้สึก', 'URL รูปภาพ', 'วันที่'];
      const rows = allMemories.map(item => [
        `"${item.id}"`,
        `"${(item.name || '').replace(/"/g, '""')}"`,
        `"${(item.role || '').replace(/"/g, '""')}"`,
        `"${(item.impression || '').replace(/"/g, '""')}"`,
        `"${item.image_url}"`,
        `"${new Date(item.created_at).toLocaleString('th-TH')}"`
      ]);

      const csvContent = "\uFEFF" + [headers.join(','), ...rows.map(e => e.join(','))].join('\n');
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `samanmitr_m304_memories_${new Date().toISOString().slice(0,10)}.csv`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    function changeBackground(e) {
      if (!isAdmin) return;
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(event) {
          const bgUrl = event.target.result;
          document.getElementById('bg-container').style.backgroundImage = `url('${bgUrl}')`;
          localStorage.setItem('m304_custom_bg', bgUrl);
        };
        reader.readAsDataURL(file);
      }
    }

    function openModal(item) {
      document.getElementById('modal-img').src = item.image_url;
      document.getElementById('modal-name').innerText = item.name;
      document.getElementById('modal-role').innerText = item.role;
      document.getElementById('modal-impression').innerText = item.impression;
      document.getElementById('card-modal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('card-modal').classList.add('hidden');
    }
  </script>
</body>
</html>
