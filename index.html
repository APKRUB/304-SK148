  <script>
    let allMemories = [];
    let isAdmin = false;

    function initSupabase() {
      try {
        if (window.supabase && SUPABASE_URL && !SUPABASE_URL.includes("วาง_PROJECT_URL")) {
          let cleanUrl = SUPABASE_URL.trim();
          if (cleanUrl.endsWith('/')) cleanUrl = cleanUrl.slice(0, -1);
          supabaseClient = window.supabase.createClient(cleanUrl, SUPABASE_KEY.trim());
        }
      } catch (err) {
        console.error("Supabase Initialization Failed:", err);
      }
    }

    function checkAdminStatus() {
      const urlParams = new URLSearchParams(window.location.search);
      isAdmin = (urlParams.get('admin') === SECRET_ADMIN_KEY);

      const bgBtn = document.getElementById('bg-uploader-btn');
      const adminNav = document.getElementById('nav-admin');

      if (isAdmin) {
        bgBtn.classList.remove('hidden');
        adminNav.classList.remove('hidden');
      } else {
        bgBtn.classList.add('hidden');
        adminNav.classList.add('hidden');
      }
    }

    function handleRoute() {
      checkAdminStatus();
      let hash = window.location.hash.replace('#', '');

      if (!hash) {
        switchTab('upload');
        return;
      }

      if (hash === 'admin' && !isAdmin) {
        alert('สำหรับผู้ดูแลระบบเท่านั้น');
        window.location.hash = 'upload';
        return;
      }

      switchTab(hash);
    }

    function switchTab(tab) {
      document.getElementById('view-upload').classList.add('hidden');
      document.getElementById('view-wall').classList.add('hidden');
      document.getElementById('view-admin').classList.add('hidden');

      if (tab === 'wall') {
        document.getElementById('view-wall').classList.remove('hidden');
        renderFloatingWall();
      } else if (tab === 'admin' && isAdmin) {
        document.getElementById('view-admin').classList.remove('hidden');
        if (physicsLoopId) cancelAnimationFrame(physicsLoopId);
        renderAdminTable();
      } else {
        document.getElementById('view-upload').classList.remove('hidden');
        if (physicsLoopId) cancelAnimationFrame(physicsLoopId);
      }
    }

    window.addEventListener('hashchange', handleRoute);

    window.addEventListener('DOMContentLoaded', () => {
      initSupabase();

      const savedBg = localStorage.getItem('m304_custom_bg');
      if (savedBg) {
        document.getElementById('bg-container').style.backgroundImage = `url('${savedBg}')`;
      }

      if (supabaseClient) {
        fetchMemories();
      }
      handleRoute();
    });

    async function fetchMemories() {
      if (!supabaseClient) return;

      const { data, error } = await supabaseClient
        .from('memories')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        console.error('Error fetching:', error);
        return;
      }
      allMemories = data || [];
      if (window.location.hash === '#wall') renderFloatingWall();
      if (window.location.hash === '#admin' && isAdmin) renderAdminTable();
    }

    /* --- JS Physics Engine for Cards --- */
    function renderFloatingWall() {
      const container = document.getElementById('wall-container');
      container.innerHTML = '';
      
      if (physicsLoopId) cancelAnimationFrame(physicsLoopId);
      physicsCards = [];

      if (allMemories.length === 0) {
        container.innerHTML = `<div class="h-full flex items-center justify-center text-slate-400">ยังไม่มีความทรงจำอัปโหลด กดปุ่ม "กรอกข้อมูล" เพื่อเริ่มแชร์ได้เลย!</div>`;
        return;
      }

      const containerRect = container.getBoundingClientRect();

      allMemories.forEach((item) => {
        const card = document.createElement('div');
        
        // Removed CSS float, added grab/grabbing cursor and pointer event protections
        card.className = 'absolute cursor-grab active:cursor-grabbing bg-slate-800/90 p-2.5 rounded-xl border border-white/20 shadow-xl w-36 sm:w-44 touch-none z-10 will-change-transform';

        const fitClass = (item.fit_mode === 'cover') ? 'object-cover' : 'object-contain bg-black/50';

        // Add pointer-events-none to children so dragging isn't interrupted by hovering text/images
        card.innerHTML = `
          <div class="relative overflow-hidden rounded-lg aspect-square mb-2 bg-slate-900 flex items-center justify-center pointer-events-none">
            <img src="${item.image_url}" class="w-full h-full ${fitClass} pointer-events-none" draggable="false">
          </div>
          <p class="text-xs font-bold truncate text-white pointer-events-none">${item.name}</p>
          <span class="text-[10px] text-pink-300 bg-pink-500/20 px-1.5 py-0.5 rounded border border-pink-500/30 pointer-events-none">${item.role}</span>
        `;

        container.appendChild(card);

        // Safe initial random spawn position inside boundaries
        const maxLeft = Math.max(0, containerRect.width - card.offsetWidth);
        const maxTop = Math.max(0, containerRect.height - card.offsetHeight);
        
        let x = Math.random() * maxLeft;
        let y = Math.random() * maxTop;

        card.style.left = '0px';
        card.style.top = '0px';
        card.style.transform = `translate(${x}px, ${y}px)`;

        // Physics State Object
        const cardData = {
          el: card,
          item: item,
          x: x,
          y: y,
          vx: (Math.random() - 0.5) * 1.5, // Initial drifting velocity X
          vy: (Math.random() - 0.5) * 1.5, // Initial drifting velocity Y
          isDragging: false,
          isClick: true,
          dragOffsetX: 0,
          dragOffsetY: 0,
          lastTime: performance.now()
        };

        physicsCards.push(cardData);

        // --- Drag Events Setup ---
        card.addEventListener('pointerdown', (e) => {
          if (e.button !== 0 && e.type !== 'touchstart') return; // Left click or touch only
          cardData.isDragging = true;
          cardData.isClick = true; // Assume it's a click until moved
          
          const rect = card.getBoundingClientRect();
          cardData.dragOffsetX = e.clientX - rect.left;
          cardData.dragOffsetY = e.clientY - rect.top;
          
          // Reset velocity while holding
          cardData.vx = 0;
          cardData.vy = 0;
          cardData.lastTime = performance.now();
          
          // Visual Pop effect when picked up
          card.style.zIndex = 50;
          card.style.transition = 'transform 0.05s linear, box-shadow 0.2s';
          card.classList.add('shadow-pink-500/50');
          card.setPointerCapture(e.pointerId);
        });

        card.addEventListener('pointermove', (e) => {
          if (!cardData.isDragging) return;
          
          const contRect = container.getBoundingClientRect();
          const newX = e.clientX - contRect.left - cardData.dragOffsetX;
          const newY = e.clientY - contRect.top - cardData.dragOffsetY;
          
          // If moved more than 5px, it's a drag, not a click
          if (Math.abs(newX - cardData.x) > 5 || Math.abs(newY - cardData.y) > 5) {
            cardData.isClick = false;
          }

          // Calculate Throw Velocity
          const now = performance.now();
          const dt = Math.max(1, now - cardData.lastTime);
          
          cardData.vx = ((newX - cardData.x) / dt) * 12; // Velocity multiplier
          cardData.vy = ((newY - cardData.y) / dt) * 12;
          
          cardData.x = newX;
          cardData.y = newY;
          cardData.lastTime = now;
          
          card.style.transform = `translate(${cardData.x}px, ${cardData.y}px)`;
        });

        const releaseCard = (e) => {
          if (!cardData.isDragging) return;
          cardData.isDragging = false;
          card.style.zIndex = 10;
          card.style.transition = ''; // Return transform control to physics loop
          card.classList.remove('shadow-pink-500/50');
          card.releasePointerCapture(e.pointerId);
          
          if (cardData.isClick) {
            openModal(item);
          }
        };

        card.addEventListener('pointerup', releaseCard);
        card.addEventListener('pointercancel', releaseCard);
      });

      // Start the game loop
      physicsLoopId = requestAnimationFrame(updatePhysics);
    }

    function updatePhysics() {
      const container = document.getElementById('wall-container');
      if (!container) return;
      
      const contRect = container.getBoundingClientRect();
      
      // Physics Constants
      const bounceDamping = 0.6; // Speed retained after hitting a wall (60%)
      const friction = 0.97; // Slows down over time in empty space
      const floatForce = 0.08; // Tiny random nudge to keep them floating

      physicsCards.forEach(cardData => {
        if (cardData.isDragging) return;

        const el = cardData.el;
        const width = el.offsetWidth;
        const height = el.offsetHeight;
        const maxLeft = Math.max(0, contRect.width - width);
        const maxTop = Math.max(0, contRect.height - height);

        // 1. Apply Empty Space Friction (Slow down gracefully)
        cardData.vx *= friction;
        cardData.vy *= friction;

        // 2. Continuous Idle Float (If moving extremely slow, nudge it gently)
        if (Math.abs(cardData.vx) < 0.2 && Math.abs(cardData.vy) < 0.2) {
          cardData.vx += (Math.random() - 0.5) * floatForce;
          cardData.vy += (Math.random() - 0.5) * floatForce;
        }

        // 3. Move the card
        cardData.x += cardData.vx;
        cardData.y += cardData.vy;

        // 4. Wall Collision Detection & Bouncing
        if (cardData.x <= 0) {
          cardData.x = 0;
          cardData.vx *= -bounceDamping; // Reverse direction and lose energy
        } else if (cardData.x >= maxLeft) {
          cardData.x = maxLeft;
          cardData.vx *= -bounceDamping;
        }

        if (cardData.y <= 0) {
          cardData.y = 0;
          cardData.vy *= -bounceDamping;
        } else if (cardData.y >= maxTop) {
          cardData.y = maxTop;
          cardData.vy *= -bounceDamping;
        }

        // 5. Render Position
        el.style.transform = `translate(${cardData.x}px, ${cardData.y}px)`;
      });

      // Loop to next frame
      physicsLoopId = requestAnimationFrame(updatePhysics);
    }

    async function handleFormSubmit(e) {
      e.preventDefault();
      if (!supabaseClient) {
        alert('กรุณาตั้งค่า SUPABASE_URL และ SUPABASE_KEY ในไฟล์ index.html ก่อนใช้งาน');
        return;
      }

      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.innerText = 'กำลังอัปโหลด...';

      const name = document.getElementById('input-name').value;
      const role = document.getElementById('input-role').value;
      const fitMode = document.getElementById('input-fit').value;
      const impression = document.getElementById('input-impression').value;
      const fileInput = document.getElementById('input-image');
      const file = fileInput.files[0];

      try {
        const fileExt = file.name.split('.').pop().toLowerCase();
        const fileName = `${Date.now()}_${Math.random().toString(36).substring(2, 7)}.${fileExt}`;

        const { error: uploadErr } = await supabaseClient
          .storage
          .from('samanmitr-photos')
          .upload(fileName, file);

        if (uploadErr) throw uploadErr;

        const { data: urlData } = supabaseClient
          .storage
          .from('samanmitr-photos')
          .getPublicUrl(fileName);

        const imageUrl = urlData.publicUrl;

        // บันทึกลง Database พร้อมคอลัมน์ fit_mode
        const { error: dbErr } = await supabaseClient
          .from('memories')
          .insert([{ name, role, impression, image_url: imageUrl, fit_mode: fitMode }]);

        if (dbErr) throw dbErr;

        // Trigger Confetti Effect 🎉
        if (window.confetti) {
          confetti({
            particleCount: 120,
            spread: 80,
            origin: { y: 0.6 }
          });
        }

        alert('บันทึกความทรงจำเรียบร้อยแล้ว! 💖');
        document.getElementById('upload-form').reset();
        await fetchMemories();
        window.location.hash = 'wall';

      } catch (err) {
        alert('เกิดข้อผิดพลาด: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = 'บันทึกความทรงจำ 💖';
      }
    }

    function renderAdminTable() {
      const tbody = document.getElementById('admin-table-body');
      tbody.innerHTML = '';

      allMemories.forEach(item => {
        const tr = document.createElement('tr');
        tr.className = 'hover:bg-slate-700/50 transition';
        const fitBadge = item.fit_mode === 'cover' ? '✂️ Cover' : '🖼️ Contain';
        tr.innerHTML = `
          <td class="p-4">
            <img src="${item.image_url}" class="w-12 h-12 object-cover rounded-lg border border-slate-600">
          </td>
          <td class="p-4 font-semibold text-white">${item.name}</td>
          <td class="p-4"><span class="text-xs bg-slate-700 px-2 py-1 rounded">${item.role}</span></td>
          <td class="p-4 text-xs max-w-xs truncate">${item.impression}</td>
          <td class="p-4 text-xs text-slate-300">${fitBadge}</td>
          <td class="p-4 text-xs text-slate-400">${new Date(item.created_at).toLocaleDateString('th-TH')}</td>
          <td class="p-4 text-center space-x-2">
            <button onclick='openEditModal(${JSON.stringify(item)})' class="px-2.5 py-1 text-xs bg-amber-500/20 text-amber-300 border border-amber-500/30 rounded hover:bg-amber-500/30">แก้ไข</button>
            <button onclick="deleteMemory('${item.id}')" class="px-2.5 py-1 text-xs bg-red-500/20 text-red-300 border border-red-500/30 rounded hover:bg-red-500/30">ลบ</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function deleteMemory(id) {
      if (!confirm('ยืนยันว่าต้องการลบรายการนี้ใช่หรือไม่?')) return;

      const { error } = await supabaseClient.from('memories').delete().eq('id', id);
      if (error) {
        alert('ลบไม่สำเร็จ: ' + error.message);
      } else {
        await fetchMemories();
        renderAdminTable();
      }
    }

    function openEditModal(item) {
      document.getElementById('edit-id').value = item.id;
      document.getElementById('edit-name').value = item.name;
      document.getElementById('edit-role').value = item.role;
      document.getElementById('edit-fit').value = item.fit_mode || 'contain';
      document.getElementById('edit-impression').value = item.impression;
      document.getElementById('edit-modal').classList.remove('hidden');
    }

    function closeEditModal() {
      document.getElementById('edit-modal').classList.add('hidden');
    }

    async function saveEdit() {
      const id = document.getElementById('edit-id').value;
      const name = document.getElementById('edit-name').value;
      const role = document.getElementById('edit-role').value;
      const fitMode = document.getElementById('edit-fit').value;
      const impression = document.getElementById('edit-impression').value;

      const { error } = await supabaseClient
        .from('memories')
        .update({ name, role, impression, fit_mode: fitMode })
        .eq('id', id);

      if (error) {
        alert('แก้ไขไม่สำเร็จ: ' + error.message);
      } else {
        closeEditModal();
        await fetchMemories();
        renderAdminTable();
      }
    }

    function exportToCSV() {
      if (!allMemories || allMemories.length === 0) {
        alert('ไม่มีข้อมูลสำหรับส่งออก');
        return;
      }

      const headers = ['ID', 'ชื่อ-นามสกุล', 'สถานะ', 'ความรู้สึก', 'สไตล์รูป', 'URL รูปภาพ', 'วันที่'];
      const rows = allMemories.map(item => [
        `"${item.id}"`,
        `"${(item.name || '').replace(/"/g, '""')}"`,
        `"${(item.role || '').replace(/"/g, '""')}"`,
        `"${(item.impression || '').replace(/"/g, '""')}"`,
        `"${item.fit_mode || 'contain'}"`,
        `"${item.image_url}"`,
        `"${new Date(item.created_at).toLocaleString('th-TH')}"`
      ]);

      const csvContent = "\uFEFF" + [headers.join(','), ...rows.map(e => e.join(','))].join('\n');
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `samanmitr_m304_memories_${new Date().toISOString().slice(0,10)}.csv`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    function changeBackground(e) {
      if (!isAdmin) return;
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(event) {
          const bgUrl = event.target.result;
          document.getElementById('bg-container').style.backgroundImage = `url('${bgUrl}')`;
          localStorage.setItem('m304_custom_bg', bgUrl);
        };
        reader.readAsDataURL(file);
      }
    }

    function openModal(item) {
      const modalImg = document.getElementById('modal-img');
      modalImg.src = item.image_url;

      if (item.fit_mode === 'cover') {
        modalImg.className = "w-full h-72 object-cover rounded-lg shadow-md";
      } else {
        modalImg.className = "max-h-[58vh] w-auto max-w-full object-contain rounded-lg shadow-md";
      }

      document.getElementById('modal-name').innerText = item.name;
      document.getElementById('modal-role').innerText = item.role;
      document.getElementById('modal-impression').innerText = item.impression;
      document.getElementById('card-modal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('card-modal').classList.add('hidden');
    }
  </script>
</body>
</html>
