<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>

    <!-- ดึง Firebase SDK มาใช้โดยตรง -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; padding: 20px; background: #2c3e50; color: white; margin: 0; }
        .panel { background: #34495e; padding: 20px; border-radius: 10px; margin-bottom: 20px; max-width: 800px; margin: 20px auto; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; background: #e74c3c; color: white; border: none; border-radius: 5px; font-size: 16px; }
        button:hover { background: #c0392b; }
        input, select { padding: 10px; margin: 5px; border-radius: 5px; border: none; font-size: 16px; width: calc(100% - 20px); box-sizing: border-box; }
        .hidden { display: none; }
        .controls { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
        .player-list { background: #2c3e50; padding: 15px; border-radius: 5px; list-style: none; }
        .player-list li { padding: 10px; border-bottom: 1px solid #34495e; display: flex; justify-content: space-between; }
    </style>
</head>
<body>

<div id="login-panel" class="panel">
    <h2>Admin Login</h2>
    <input type="password" id="adminPwd" placeholder="รหัสผ่านแอดมิน">
    <button onclick="login()">เข้าสู่ระบบ</button>
</div>

<div id="admin-dashboard" class="panel hidden">
    <h2>แผงควบคุมเกม</h2>
    <div class="controls">
        <button onclick="startGame()" style="background: #2ecc71;">▶️ 1. เริ่มให้ตอบ (ส่งโจทย์)</button>
        <button onclick="revealAnswer()" style="background: #f1c40f; color: black;">👀 2. เปิดเฉลย</button>
        <button onclick="resetGame()" style="background: #95a5a6;">🔄 รีเซ็ตกระดานใหม่</button>
    </div>
    
    <hr>
    <h3>สร้าง/แก้ไขคำถาม</h3>
    <input type="text" id="qText" placeholder="โจทย์คำถาม เช่น เมืองหลวงของไทยคือ?">
    <select id="qType" onchange="toggleOptions()">
        <option value="choice">โหมดช้อยส์ (4 ตัวเลือก)</option>
        <option value="text">โหมดเติมคำตอบ</option>
    </select>
    
    <div id="choice-inputs">
        <input type="text" id="opt1" placeholder="ตัวเลือกที่ 1">
        <input type="text" id="opt2" placeholder="ตัวเลือกที่ 2">
        <input type="text" id="opt3" placeholder="ตัวเลือกที่ 3">
        <input type="text" id="opt4" placeholder="ตัวเลือกที่ 4">
    </div>

    <input type="text" id="qAnswer" placeholder="คำตอบที่ถูกต้อง (ต้องตรงกับตัวเลือกหรือคำที่ให้เติม)">
    <button onclick="setNextQuestion()" style="background: #3498db; width: 100%;">บันทึกเป็นข้อปัจจุบัน และให้ผู้เล่นสแตนด์บาย</button>
    
    <hr>
    <h3>ผู้เล่นในห้อง (อัปเดตสด)</h3>
    <ul id="player-list" class="player-list"></ul>
</div>

<script>
    // ==========================================
    // 1. ใส่ข้อมูล Firebase ของคุณตรงนี้ 👇 
    // (ใช้ Config ตัวเดียวกันกับหน้า index.html)
    // ==========================================
    const firebaseConfig = {
        apiKey: "ใส่_API_KEY",
        authDomain: "ใส่_AUTH_DOMAIN",
        databaseURL: "ใส่_DATABASE_URL",
        projectId: "ใส่_PROJECT_ID",
        storageBucket: "ใส่_STORAGE_BUCKET",
        messagingSenderId: "ใส่_SENDER_ID",
        appId: "ใส่_APP_ID"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // ==========================================
    // 2. ระบบของแอดมิน
    // ==========================================
    function login() {
        if(document.getElementById('adminPwd').value === "admin123") {
            document.getElementById('login-panel').classList.add('hidden');
            document.getElementById('admin-dashboard').classList.remove('hidden');
            loadPlayers();
        } else {
            alert("รหัสผ่านผิด!");
        }
    }

    function toggleOptions() {
        const type = document.getElementById('qType').value;
        const choiceInputs = document.getElementById('choice-inputs');
        if(type === 'choice') {
            choiceInputs.classList.remove('hidden');
        } else {
            choiceInputs.classList.add('hidden');
        }
    }

    function setNextQuestion() {
        const text = document.getElementById('qText').value;
        const type = document.getElementById('qType').value;
        const ans = document.getElementById('qAnswer').value;
        
        let optionsArr = [];
        if(type === 'choice') {
            optionsArr = [
                document.getElementById('opt1').value,
                document.getElementById('opt2').value,
                document.getElementById('opt3').value,
                document.getElementById('opt4').value
            ];
        }
        
        if(!text || !ans) return alert("กรุณาใส่คำถามและคำตอบให้ครบ");

        // รีเซ็ตคำตอบเก่าของผู้เล่นทุกคนก่อนขึ้นข้อใหม่
        db.ref('players').once('value', snap => {
            if(snap.exists()) {
                let updates = {};
                snap.forEach(child => {
                    updates[child.key + '/currentAnswer'] = "";
                });
                db.ref('players').update(updates);
            }
        });

        // ส่งข้อมูลข้อใหม่ไปสแตนด์บาย
        db.ref('gameState').set({
            status: "waiting", 
            currentQuestionText: text,
            type: type,
            options: optionsArr,
            correctAnswer: ans
        });
        alert("เซ็ตคำถามเรียบร้อย! หน้าจอผู้เล่นจะขึ้นรอ ให้กด 'เริ่มให้ตอบ' เมื่อพร้อม");
    }

    function startGame() {
        db.ref('gameState').update({ status: "playing" });
    }

    function revealAnswer() {
        db.ref('gameState').update({ status: "revealed" });
        calculateScores(); // คำนวณคะแนนตอนเปิดเฉลย
    }

    function calculateScores() {
        db.ref('gameState/correctAnswer').once('value').then(snap => {
            const correctAns = snap.val();
            db.ref('players').once('value', playersSnap => {
                let updates = {};
                playersSnap.forEach(player => {
                    let pData = player.val();
                    if(pData.currentAnswer === correctAns) {
                        updates[player.key + '/score'] = (pData.score || 0) + 1;
                    }
                });
                if(Object.keys(updates).length > 0) {
                    db.ref('players').update(updates);
                }
            });
        });
    }

    function resetGame() {
        if(confirm("ยืนยันการลบข้อมูลผู้เล่นและเริ่มเกมใหม่ทั้งหมด?")) {
            db.ref('players').remove();
            db.ref('gameState').set({ status: "waiting" });
        }
    }

    function loadPlayers() {
        db.ref('players').on('value', snap => {
            const list = document.getElementById('player-list');
            list.innerHTML = "";
            snap.forEach(child => {
                let p = child.val();
                let ansText = p.currentAnswer ? `ตอบ: ${p.currentAnswer}` : "กำลังคิด...";
                list.innerHTML += `<li><span>👤 ${child.key}</span> <span>${ansText} | คะแนน: ${p.score}</span></li>`;
            });
        });
    }
</script>
</body>
</html>
