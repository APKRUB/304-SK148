<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Game - Player</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background: #f4f4f9; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .hidden { display: none; }
        input, button { padding: 10px; margin: 10px 0; width: 80%; font-size: 16px; border-radius: 5px; }
        button { background: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background: #0056b3; }
        .choice-btn { background: #28a745; margin: 5px; width: 45%; }
    </style>
</head>
<body>
    <div class="container">
        <!-- หน้า Login ผู้เล่น -->
        <div id="login-section">
            <h2>เข้าร่วมเกม</h2>
            <p id="room-status" style="color: red;">กำลังตรวจสอบสถานะห้อง...</p>
            <input type="text" id="player-name" placeholder="กรอกชื่อของคุณ" disabled>
            <button id="join-btn" disabled onclick="joinGame()">เข้าสู่ห้อง</button>
        </div>

        <!-- หน้ารอ -->
        <div id="waiting-section" class="hidden">
            <h2>รอแอดมินเริ่มเกม...</h2>
            <p>เตรียมตัวให้พร้อม!</p>
        </div>

        <!-- หน้าคำถาม -->
        <div id="question-section" class="hidden">
            <h2 id="question-text">คำถามจะขึ้นที่นี่</h2>
            <div id="choices-container"></div>
            <div id="text-answer-container" class="hidden">
                <input type="text" id="text-answer" placeholder="พิมพ์คำตอบ...">
                <button onclick="submitTextAnswer()">ส่งคำตอบ</button>
            </div>
        </div>

        <!-- หน้าผลลัพธ์ -->
        <div id="result-section" class="hidden">
            <h2 id="result-text">รอผล...</h2>
        </div>
    </div>

    <!-- Firebase SDK (ใช้ v8 เพื่อความง่ายในการเขียนแบบไม่ต้องมี Bundler) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // 🛑 นำ config จาก Firebase ของคุณมาใส่ตรงนี้ 🛑
const firebaseConfig = {
  apiKey: "AIzaSyBLr_JDM3JOriV9quYtTPz1PdZaczvIGkw",
  authDomain: "modals-304-148.firebaseapp.com",
  projectId: "modals-304-148",
  storageBucket: "modals-304-148.firebasestorage.app",
  messagingSenderId: "955363561060",
  appId: "1:955363561060:web:d2ce1c6482ca9ebcd11971",
  measurementId: "G-BHP5XZ90CV"
};
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let playerName = "";

        // ตรวจสอบว่าแอดมินเปิดห้องหรือยัง
        db.ref("roomState/isOpen").on("value", (snapshot) => {
            const isOpen = snapshot.val();
            const statusText = document.getElementById("room-status");
            const nameInput = document.getElementById("player-name");
            const joinBtn = document.getElementById("join-btn");

            if (isOpen) {
                statusText.innerText = "ห้องเปิดแล้ว! กรอกชื่อได้เลย";
                statusText.style.color = "green";
                nameInput.disabled = false;
                joinBtn.disabled = false;
            } else {
                statusText.innerText = "ห้องยังไม่เปิด รอก่อนนะ...";
                statusText.style.color = "red";
                nameInput.disabled = true;
                joinBtn.disabled = true;
            }
        });

        function joinGame() {
            playerName = document.getElementById("player-name").value;
            if (!playerName) return alert("กรุณากรอกชื่อ!");
            
            // บันทึกชื่อลง DB
            db.ref("players/" + playerName).set({ score: 0 });
            
            document.getElementById("login-section").classList.add("hidden");
            document.getElementById("waiting-section").classList.remove("hidden");
            listenToGameState();
        }

        function listenToGameState() {
            db.ref("roomState").on("value", (snapshot) => {
                const state = snapshot.val();
                if (state.status === "playing") {
                    showQuestion(state.currentQuestion);
                } else if (state.status === "waitingNext") {
                    showWaitingScreen();
                }
            });
        }

        function showQuestion(questionData) {
            document.getElementById("waiting-section").classList.add("hidden");
            document.getElementById("result-section").classList.add("hidden");
            document.getElementById("question-section").classList.remove("hidden");
            
            document.getElementById("question-text").innerText = questionData.text;
            const choicesContainer = document.getElementById("choices-container");
            const textContainer = document.getElementById("text-answer-container");
            
            choicesContainer.innerHTML = "";
            
            if (questionData.type === "choice") {
                choicesContainer.classList.remove("hidden");
                textContainer.classList.add("hidden");
                questionData.options.forEach(opt => {
                    const btn = document.createElement("button");
                    btn.className = "choice-btn";
                    btn.innerText = opt;
                    btn.onclick = () => submitAnswer(opt);
                    choicesContainer.appendChild(btn);
                });
            } else {
                choicesContainer.classList.add("hidden");
                textContainer.classList.remove("hidden");
            }
        }

        function submitAnswer(answer) {
            db.ref("players/" + playerName + "/currentAnswer").set(answer);
            document.getElementById("question-section").classList.add("hidden");
            document.getElementById("result-section").classList.remove("hidden");
            document.getElementById("result-text").innerText = "ส่งคำตอบแล้ว รอแอดมินเฉลย...";
        }

        function submitTextAnswer() {
            const ans = document.getElementById("text-answer").value;
            submitAnswer(ans);
        }

        function showWaitingScreen() {
            document.getElementById("result-text").innerText = "เตรียมพบกับข้อถัดไป...";
        }
    </script>
</body>
</html>
